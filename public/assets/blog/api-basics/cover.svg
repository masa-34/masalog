<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="630" fill="url(#bg)"/>

  <!-- クライアント箱 -->
  <g>
    <rect x="110" y="260" width="220" height="120" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="220" y="315" font-family="'Segoe UI', sans-serif" font-size="24" fill="#f8fafc" text-anchor="middle">Client</text>
    <text x="220" y="345" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">アプリ / ブラウザ</text>
  </g>

  <!-- サーバー箱 -->
  <g>
    <rect x="970" y="260" width="220" height="120" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="1080" y="315" font-family="'Segoe UI', sans-serif" font-size="24" fill="#f8fafc" text-anchor="middle">Server</text>
    <text x="1080" y="345" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">API</text>
  </g>

  <!-- リクエスト矢印 -->
  <line x1="335" y1="300" x2="960" y2="300" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow1)"/>
  <text x="650" y="285" font-family="monospace" font-size="18" fill="#38bdf8" text-anchor="middle">GET /users/1</text>

  <!-- レスポンス矢印 -->
  <line x1="960" y1="345" x2="335" y2="345" stroke="#4ade80" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="650" y="375" font-family="monospace" font-size="18" fill="#4ade80" text-anchor="middle">200 OK { "name": "..." }</text>

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/>
    </marker>
  </defs>

  <text x="120" y="90" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#f8fafc">APIの仕組み</text>
  <text x="120" y="130" font-family="'Segoe UI', sans-serif" font-size="22" fill="#94a3b8">種類とリクエスト/レスポンスの基本</text>
</svg>
