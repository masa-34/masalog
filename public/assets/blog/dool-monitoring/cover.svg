<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="630" fill="url(#bg)"/>

  <!-- ターミナル風カード -->
  <rect x="110" y="150" width="1080" height="360" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <circle cx="150" cy="188" r="8" fill="#ef4444"/>
  <circle cx="178" cy="188" r="8" fill="#eab308"/>
  <circle cx="206" cy="188" r="8" fill="#22c55e"/>
  <text x="150" y="188" font-family="monospace" font-size="16" fill="#64748b" text-anchor="middle" dx="500">$ dool -cdngy 1</text>

  <!-- ヘッダー行 -->
  <text x="150" y="232" font-family="monospace" font-size="15" fill="#38bdf8">--total-cpu-usage-- -dsk/total- -net/total- --system--</text>
  <text x="150" y="256" font-family="monospace" font-size="15" fill="#64748b">usr sys idl wai stl| read  writ| recv  send| int   csw</text>

  <!-- データ行（バー風） -->
  <g font-family="monospace" font-size="15" fill="#e2e8f0">
    <text x="150" y="290"> 12   3  82   3   0|1024k  512k| 45k  120k| 980  1.2k</text>
    <text x="150" y="316"> 45  10  38   7   0|3.5M  1.1M | 89k  210k|1.4k  2.0k</text>
    <text x="150" y="342" fill="#f87171"> 78  15   4   3   0|8.2M  4.8M |210k  520k|3.1k  4.6k</text>
    <text x="150" y="368"> 20   5  70   5   0|1.1M  600k| 52k  140k|1.0k  1.3k</text>
  </g>

  <!-- 簡易バーグラフ -->
  <g>
    <rect x="150" y="400" width="120" height="14" fill="#1e293b" stroke="#334155"/>
    <rect x="150" y="400" width="90" height="14" fill="#38bdf8"/>
    <text x="150" y="432" font-family="monospace" font-size="14" fill="#94a3b8">CPU</text>

    <rect x="320" y="400" width="120" height="14" fill="#1e293b" stroke="#334155"/>
    <rect x="320" y="400" width="60" height="14" fill="#4ade80"/>
    <text x="320" y="432" font-family="monospace" font-size="14" fill="#94a3b8">DISK</text>

    <rect x="490" y="400" width="120" height="14" fill="#1e293b" stroke="#334155"/>
    <rect x="490" y="400" width="100" height="14" fill="#fb923c"/>
    <text x="490" y="432" font-family="monospace" font-size="14" fill="#94a3b8">NET</text>

    <rect x="660" y="400" width="120" height="14" fill="#1e293b" stroke="#334155"/>
    <rect x="660" y="400" width="45" height="14" fill="#a78bfa"/>
    <text x="660" y="432" font-family="monospace" font-size="14" fill="#94a3b8">MEM</text>
  </g>

  <text x="120" y="90" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#f8fafc">doolでリソースを監視する</text>
  <text x="120" y="130" font-family="'Segoe UI', sans-serif" font-size="22" fill="#94a3b8">CPU・メモリ・ディスク・ネットワークをリアルタイムに見る</text>
</svg>
