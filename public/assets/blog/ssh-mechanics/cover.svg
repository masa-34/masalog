<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="630" fill="url(#bg)"/>

  <!-- ターミナル風カード -->
  <rect x="120" y="140" width="700" height="350" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <circle cx="160" cy="180" r="8" fill="#ef4444"/>
  <circle cx="188" cy="180" r="8" fill="#eab308"/>
  <circle cx="216" cy="180" r="8" fill="#22c55e"/>
  <text x="160" y="240" font-family="monospace" font-size="22" fill="#38bdf8">$ ssh user@host</text>
  <text x="160" y="280" font-family="monospace" font-size="18" fill="#94a3b8">key exchange ...</text>
  <text x="160" y="312" font-family="monospace" font-size="18" fill="#94a3b8">host key verify ...</text>
  <text x="160" y="344" font-family="monospace" font-size="18" fill="#94a3b8">publickey auth ...</text>
  <text x="160" y="376" font-family="monospace" font-size="20" fill="#4ade80">session established</text>

  <!-- 鍵アイコン -->
  <g transform="translate(950,300)">
    <circle cx="0" cy="0" r="150" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <g transform="translate(-55,-35) scale(1.3)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#fbbf24" stroke-width="10"/>
      <rect x="18" y="-6" width="70" height="12" fill="#fbbf24"/>
      <rect x="70" y="6" width="12" height="20" fill="#fbbf24"/>
      <rect x="90" y="6" width="12" height="14" fill="#fbbf24"/>
    </g>
  </g>

  <text x="120" y="90" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#f8fafc">SSHの仕組み</text>
  <text x="120" y="130" font-family="'Segoe UI', sans-serif" font-size="22" fill="#94a3b8">鍵交換・ホスト認証・公開鍵認証の流れ</text>
</svg>
